<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
</head>
<body>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
        background-image: url(cloth.jpg);
        
        
        background-position: center;
        background-repeat: no-repeat;
        }
        .box{
            min-height: 100vh;
            display:flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        form{
            width:97%;
            padding:40px 10px;
            background-color: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border:1px solid rgba(255,255,255,0.3);
            border-radius: 20px 150px 150px 20px;
            display: flex;
            align-items:center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            
        }
        form h3{
             color:black;
            text-align: center;
            font-size: 40px;
        }
        form p{
            color:black;
            text-align: center;
            font-size:20px;
        }
        input{
            width:70%;
            padding:15px 30px;
            margin-left:-10px;
            border:none;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            text-align: center;
            background-color: rgba(0, 128, 0, 0.434);
            backdrop-filter: blur(9px);
            border:1px solid rgba(255,255,255,0.3);
            color: black;
            font-size: 17PX;

        }
        button{
            padding: 15px;
            border:none;
            border-radius: 10px;
            background: #065d34af;
            color:white;
            font-size: 16px;
            margin-top: 60px;
            width: 50%;
        }
        form a{
            color: black;
        }
    </style>


<div class="box">
    <form>
        <h3>Welcome Back</h3>
        <p>Login to continue</p>

        <input type="email" placeholder="you@23gmail.com" >
        <input type="password" placeholder="password">

        <button type="submit">LOGIN</button>

        <p>Don't have account? <a herf="#">Sign up</a></p>
    </form>
</div>
    
</body>
</html>
